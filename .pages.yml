media:
  input: public/images
  output: /images
  extensions: [png, jpg, jpeg, webp, svg]
  rename: safe

content:
  # 博客文章
  - name: posts
    label: 博客文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter

    filename:
      template: "{primary}.md"
      field: create

    view:
      fields: [title, author, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: author
        label: 作者
        type: string
        required: true

      - name: date
        label: 发布日期
        type: date
        required: true
        options:
          format: MM-dd-yyyy

      - name: image
        label: 封面图
        type: object
        required: true
        fields:
          - name: url
            label: 图片
            type: image
            required: true

          - name: alt
            label: 图片说明
            type: string
            required: true

      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true

  # 项目展示
  - name: projects
    label: 项目展示
    type: collection
    path: src/content/projects
    format: yaml-frontmatter

    filename:
      template: "{primary}.md"
      field: create

    view:
      fields: [title, platform, stack]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc

    fields:
      - name: title
        label: 项目名称
        type: string
        required: true

      - name: description
        label: 项目简介
        type: text
        required: true

      - name: image
        label: 项目封面
        type: object
        required: true
        fields:
          - name: url
            label: 图片
            type: image
            required: true

          - name: alt
            label: 图片说明
            type: string
            required: true

      - name: worksImage1
        label: 详情图 1
        type: object
        required: true
        fields:
          - name: url
            label: 图片
            type: image
            required: true

          - name: alt
            label: 图片说明
            type: string
            required: true

      - name: worksImage2
        label: 详情图 2
        type: object
        required: true
        fields:
          - name: url
            label: 图片
            type: image
            required: true

          - name: alt
            label: 图片说明
            type: string
            required: true

      - name: platform
        label: 运行平台
        type: string
        required: true

      - name: stack
        label: 技术栈
        type: string
        required: true

      - name: website
        label: 网站地址
        type: string
        required: true

      - name: github
        label: GitHub 地址
        type: string
        required: true

      - name: body
        label: 项目正文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true