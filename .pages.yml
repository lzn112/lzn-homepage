media:
  input: public/images
  output: /images
  extensions: [png, jpg, jpeg, webp, svg]
  rename: safe

content:
  - name: home
    label: 首页编辑
    type: file
    path: src/data/home.json
    format: json

    operations:
      delete: false

    fields:
      - name: pageTitle
        label: 浏览器页面标题
        type: string
        required: true

      - name: name
        label: 姓名
        type: string
        required: true

      - name: role
        label: 职业标签
        type: string
        required: true

      - name: heroImage
        label: 首页图片
        type: image
        required: true

      - name: aboutTitle
        label: About 标题
        type: string
        required: true

      - name: about
        label: About 段落
        type: text
        list: true
        required: true

      - name: projectsButtonText
        label: 项目按钮文字
        type: string
        required: true

      - name: projectsButtonUrl
        label: 项目按钮链接
        type: string
        required: true

      - name: skillsTitle
        label: Skills 标题
        type: string
        required: true

      - name: skills
        label: 技能图标
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: 技能名称
            type: string
            required: true

          - name: icon
            label: 图标地址
            type: string
            required: true

      - name: interestsTitle
        label: Interests 标题
        type: string
        required: true

      - name: interests
        label: Interests 内容
        type: text
        required: true
  # 博客文章
  - name: posts
    label: 博客文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter

    filename:
      template: "{primary}.md"
      field: create

    view:
      fields: [title, author, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: author
        label: 作者
        type: string
        required: true

      - name: date
        label: 发布日期
        type: date
        required: true
        options:
          format: MM-dd-yyyy

      - name: image
        label: 封面图
        type: object
        required: true
        fields:
          - name: url
            label: 图片
            type: image
            required: true

          - name: alt
            label: 图片说明
            type: string
            required: true

      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true

  # 项目展示
  - name: projects
    label: 项目展示
    type: collection
    path: src/content/projects
    format: yaml-frontmatter

    filename:
      template: "{primary}.md"
      field: create

    view:
      fields: [title, platform, stack]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc

    fields:
      - name: title
        label: 项目名称
        type: string
        required: true

      - name: description
        label: 项目简介
        type: text
        required: true

      - name: image
        label: 项目封面
        type: object
        required: true
        fields:
          - name: url
            label: 图片
            type: image
            required: true

          - name: alt
            label: 图片说明
            type: string
            required: true

      - name: worksImage1
        label: 详情图 1
        type: object
        required: true
        fields:
          - name: url
            label: 图片
            type: image
            required: true

          - name: alt
            label: 图片说明
            type: string
            required: true

      - name: worksImage2
        label: 详情图 2
        type: object
        required: true
        fields:
          - name: url
            label: 图片
            type: image
            required: true

          - name: alt
            label: 图片说明
            type: string
            required: true

      - name: platform
        label: 运行平台
        type: string
        required: true

      - name: stack
        label: 技术栈
        type: string
        required: true

      - name: website
        label: 网站地址
        type: string
        required: true

      - name: github
        label: GitHub 地址
        type: string
        required: true

      - name: body
        label: 项目正文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true